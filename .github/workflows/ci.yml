name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No version input: the action reads package.json's packageManager.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      # `--format github` turns findings into inline annotations on the diff.
      - name: Lint
        run: pnpm lint --format github

      # `tsc -b` covers the extension, the Node-side config and guards, and the
      # Playwright harness through the project references.
      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # Zero errors is the bar. The three expected warnings are listed in
      # docs/build-targets.md; a new one from the extension's own code is a
      # regression.
      - name: Lint Firefox package
        run: pnpm lint:firefox

  # Its own job, so a browser-level failure reddens only this signal and the
  # unit results stay readable. It runs e2e/specs only: e2e/real and e2e/manual
  # need a signed-in Instagram account and never run here.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
