version: 2

updates:
  # A browser extension ships its bundled dependencies, so they need to keep
  # moving even when nothing else in the repository does.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # react and react-dom refuse to run unless their versions match exactly,
      # so they have to move in the same pull request.
      react:
        dependency-type: production
        patterns:
          - react
          - react-dom
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
