<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 768x768 tile centred in 1024, i.e. 96x96 art in a 128 canvas. At 16px the
       tile is 12 device pixels, so 64 units is exactly one of them: the disc's
       edges sit on multiples of 64 and render crisp instead of smeared.
       Teal against the near-white mark is about 4.9:1 in luminance. -->
  <rect x="128" y="128" width="768" height="768" rx="170" fill="#0F766E"/>

  <!-- A crescent moon, the Do Not Disturb sign. A crescent's filled mass sits
       down and to the left of its disc, so the disc is moved one device pixel
       up and right of the tile centre, which puts the mass within a pixel of
       it. Keep the radii: a thinner crescent loses its tips at 16px. See
       docs/icon-explorations.md for the directions this replaced. -->
  <mask id="bite">
    <rect width="1024" height="1024" fill="#fff"/>
    <circle cx="704" cy="320" r="224" fill="#000"/>
  </mask>
  <circle cx="576" cy="448" r="256" fill="#F0FDFA" mask="url(#bite)"/>
</svg>
